[env]
_.path = ["lua_modules/bin"]
LUA_PATH = "lua_modules/share/lua/5.1/?.lua;lua_modules/share/lua/5.1/?/init.lua;;"
LUA_CPATH = "lua_modules/lib/lua/5.1/?.dll;;"

[tasks]
test = "busted spec/"
test-focus = "busted spec/ --filter focus"
format = "stylua lua/ spec/"

[tasks.check]
description = "Check the code for errors (lint + test + format)"
depends = ["lint", "test", "format"]

[tasks.build]
description = "Install dependencies"
run = """
luarocks init --no-gitignore
luarocks install busted 2.2.0-1

mise tasks
"""

[tasks.lint]
description = "Lint the codebase"
run = """
selene ./lua/ ./spec/

if rg "#focus" --glob "*.lua" ./spec/; then
  echo "\n";
  echo "Error: {{ vars.COLOR_GREEN }}#focus{{ vars.COLOR_RESET }} tags found in the codebase.\n";
  echo "Please remove them to prevent issues with not accidentally running all tests.";
  exit 1; \
fi
"""
run_windows = '''
selene lua spec
if errorlevel 1 exit /b 1
rg "#focus" --glob "*.lua" spec
if errorlevel 2 exit /b 1
if errorlevel 1 exit /b 0
echo Error: #focus tags found in the codebase.
exit /b 1
'''

[vars]
COLOR_RESET = '\033[0m'
COLOR_GREEN = '\033[1;32m'
